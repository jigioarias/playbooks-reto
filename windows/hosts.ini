# Inventario de ejemplo - reemplazar por las IPs/hostnames reales
[windows_servers]
winserver1.midominio.com  ansible_host=10.0.0.21
winserver2.midominio.com  ansible_host=10.0.0.22

[windows_servers:vars]
ansible_user=Administrator
ansible_password="{{ vault_windows_password }}"   # usar Ansible Vault, no texto plano
ansible_connection=winrm
ansible_winrm_transport=ntlm       # o 'kerberos'/'credssp' según el entorno
ansible_winrm_server_cert_validation=ignore   # usar 'validate' con certificados válidos en producción
ansible_port=5986                  # 5985 si es HTTP sin cifrar (no recomendado)
